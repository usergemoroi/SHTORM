<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Mobile Chat</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { background: #333; padding: 10px; border-radius: 10px; margin-bottom: 10px; width: fit-content; max-width: 80%; }
        .input-area { display: flex; padding: 10px; background: #222; }
        input { flex: 1; padding: 10px; border: none; border-radius: 5px; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="text" placeholder="Пиши тут...">
        <button onclick="send()">OK</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script>
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']); // Бесплатный узел обмена
        const chat = gun.get('my-unique-chat-room-123'); // Название комнаты

        function send() {
            const txt = document.getElementById('text').value;
            if(txt) {
                chat.set({msg: txt, time: Date.now()});
                document.getElementById('text').value = '';
            }
        }

        chat.map().once((data) => {
            if(data && data.msg) {
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerText = data.msg;
                document.getElementById('chat').appendChild(div);
            }
        });
    </script>
</body>
</html>
